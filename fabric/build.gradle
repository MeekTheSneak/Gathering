// ---------------------------------------------------------------------------
// :fabric - port target. Verified per phase, not per commit (design brief 13).
// ---------------------------------------------------------------------------
plugins {
    id 'java-library'
    id 'fabric-loom'
}

// A local, not rootProject.sharedModules used inline: inside a plugin's configuration
// closure the delegate resolves `rootProject` to something of its own, and the failure reads
// as a missing property on an unrelated type.
def sharedModules = rootProject.ext.sharedModules

// Official Mojang mappings, matching :common and :neoforge, so one source of
// names spans all three modules.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    sharedModules.each { compileOnly project(it) }
}

loom {
    // One field, so a card shop can be added to a village's house pool. Matches the NeoForge
    // access transformer; see LocalGameStore.
    accessWidenerPath = file('src/main/resources/gathering.accesswidener')

    runs {
        client {
            client()
            // Armed only when asked for, exactly as NeoForge's is: -Pdevscene drives the
            // client through the scripted session and photographs it. Both loaders read the
            // same property because the scene itself lives in :common - the whole point of
            // running it here is to find out whether the second loader plays the same game,
            // which booting proves nothing about.
            if (project.hasProperty('devscene')) {
                property 'gathering.devscene', '1'
                // And -Pgallery on top of it photographs every look wearing the same three
                // screens. Separate because it is not a check and has no business in a gate.
                if (project.hasProperty('gallery')) {
                    property 'gathering.gallery', '1'
                }
            }
        }
        server { server() }
    }

    // Without this the mod's code loads and its assets do not.
    //
    // Fabric Loader works out a mod's roots from where it found the fabric.mod.json, which
    // is this module and only this module. :common's processed resources - every texture,
    // model, lang file and font in the mod - sit on the runtime classpath as a separate
    // entry with no fabric.mod.json of their own, so nothing serves them as a resource pack
    // and the game never sees them.
    //
    // The symptom is not a crash. It is a mod that boots, registers everything, logs happily,
    // and then draws missing textures and raw translation keys - which is why this survived
    // until somebody actually looked at the resource pack list on startup. :neoforge has
    // carried the same declaration since it was written.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sharedModules.each { sourceSet project(it).sourceSets.main }
        }
    }
}

tasks.named('jar', Jar) {
    sharedModules.each { from project(it).sourceSets.main.output }
}

// ---------------------------------------------------------------------------
// The in-world checks for this loader.
//
// Its own source set and its own mod id, so none of it is in the jar a player installs -
// unlike :neoforge, whose game tests sit in src/main because NeoForge's runner finds them by
// annotation there. What is checked here is only what is this loader's own: the loot hook,
// the registration bootstrap and the break rules. Everything else is :common's and is checked
// once, on the other loader, because running the same assertions twice against the same code
// proves nothing the first run did not.
// ---------------------------------------------------------------------------
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        // The scripted client run, shared with :neoforge's game tests. Development code: here,
        // in the runs, and never in the jar. Ticked by DevSceneTicks.
        java.srcDir rootProject.file('common/src/devscene/java')
    }
}

// After the source set rather than inside it. A source set's classpath is copied at the moment
// it is declared, and the shared outputs are added to main's a few lines further down - so the
// testmod compiled against :common and then could not find a class in it at runtime.
sharedModules.each {
    sourceSets.testmod.compileClasspath += project(it).sourceSets.main.output
    sourceSets.testmod.runtimeClasspath += project(it).sourceSets.main.output
}

loom.runs {
    gametest {
        server()
        name 'Fabric game tests'
        source sourceSets.testmod
        property 'fabric-api.gametest'
        property 'fabric-api.gametest.report-file',
                "${project.layout.buildDirectory.get()}/test-results/fabric-gametest.xml"
    }
}

loom.mods {
    gathering_testmod {
        sourceSet sourceSets.testmod
    }
}

// The client run carries the test mod, because the scripted run lives there now and it is the
// client that runs it. Set here rather than where the run is declared: the source set does not
// exist yet at that point in the file. The dedicated server run is left on main.
loom.runs.client {
    source sourceSets.testmod
}

// The scripted tour makes its world under a name it reuses, and a world made that way inherits the
// last run's folders - tournaments and decks the steps do not expect - so it starts from nothing,
// as tools/shots.sh and :neoforge:runClient -Pdevscene already do.
tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        if (project.hasProperty('devscene')) {
            delete file('run/saves/GatheringDevScene')
        }
    }
}

// Two clients and the protocol check between them: a host opening a world to LAN, and a joiner
// that may answer with another protocol number (-PpretendProtocol=11). Each in its own run
// directory, so neither writes over the other's options or worlds. See ProtocolScene.
loom.runs {
    protocolHost {
        client()
        name 'Protocol check: host'
        runDir 'runs/protocol-host'
        source sourceSets.testmod
        property 'gathering.protocolscene', 'host'
        programArgs '--username', 'Host'
    }
    // The game's own keys, pressed with Gathering installed: see KeyScene.
    keyScene {
        client()
        name 'Key check'
        runDir 'runs/key-scene'
        source sourceSets.testmod
        property 'gathering.keyscene', '1'
    }
    protocolJoin {
        client()
        name 'Protocol check: joiner'
        runDir 'runs/protocol-join'
        source sourceSets.testmod
        property 'gathering.protocolscene', 'join'
        if (project.hasProperty('pretendProtocol')) {
            property 'gathering.pretendProtocol', project.property('pretendProtocol').toString()
        }
        programArgs '--username', 'Joiner'
    }
}

// Dev runs need the shared classes and assets without dragging :common's own Minecraft
// dependency into Loom's remapped runtime, so take the outputs rather than the projects.
sharedModules.each {
    sourceSets.main.runtimeClasspath += project(it).sourceSets.main.output
}

tasks.named('compileJava') {
    dependsOn sharedModules.collect { "${it}:classes" }
}

processResources {
    def expandProps = [
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_license    : mod_license,
        mod_version    : mod_version,
        mod_authors    : mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        java_version   : java_version,
        // The oldest loader and API it runs on, checked, rather than the ones it was built against. "fabric-api":
        // "*" accepted any version at all, including ones for a different Minecraft, which turns a dependency
        // refusal into a crash somewhere in the middle of a game; the newest cut out packs a release behind.
        fabric_loader_version: fabric_loader_min_version,
        fabric_api_version: fabric_api_min_version,
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') { expand expandProps }
}

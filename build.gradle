// Root build. Holds only what is genuinely shared; each module states its own toolchain.
plugins {
    id 'java'
    id 'idea'
}

/**
 * The modules whose classes and resources are part of the mod itself rather than of a loader.
 *
 * <p>Both loaders have to declare these to their own loader plugin, or that loader serves the
 * mod's code without its assets - a mod that boots, registers everything, logs happily, and
 * then draws missing textures and untranslated keys. Fabric shipped exactly that until
 * somebody read the resource pack list on startup.
 *
 * <p>Stated once here so the two cannot drift apart again. Adding a shared module means
 * adding it here and nowhere else.
 */
ext.sharedModules = [':common', ':core']

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    group = project.mod_group_id
    version = project.mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = project.java_version as int
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }

    repositories {
        mavenCentral()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
        maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    }
}

/**
 * The verification gate, in one command.
 *
 * Nothing is reported done until this exits zero. NeoForge runs the full gate; Fabric is a
 * port target, verified per phase rather than per commit, so its runs are not wired in here.
 */
tasks.register('verify') {
    group = 'verification'
    description = 'Compile, test, fences, data generation, and headless game tests.'
    dependsOn ':build', ':neoforge:runData', ':neoforge:runGameTestServer'
}

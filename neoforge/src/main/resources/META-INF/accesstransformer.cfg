# The list of buildings a jigsaw pool can produce.
#
# A village's house pool is loaded from data and then frozen, and vanilla keeps the list to
# itself. A data pack can only replace such a pool whole, which for a mod means quietly
# deleting every other mod's village building - so adding a card shop to the villages means
# adding to this list, and there is no other door into it.
#
# One line, and it opens a field rather than rewriting a method: see LocalGameStore.
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool templates

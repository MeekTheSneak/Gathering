modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/MeekTheSneak/Gathering/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
# The project icon, 256 by 256, at the root of the jar. The mod list draws it fifty GUI pixels
# square, smoothed (logoBlur's default).
logoFile = "gathering.png"
authors = "${mod_authors}"
description = '''
${mod_description}

Unofficial Fan Content permitted under the Fan Content Policy. Not approved/endorsed by
Wizards. Portions of the materials used are property of Wizards of the Coast.
(c)Wizards of the Coast LLC.

NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.

Card data and images courtesy of Scryfall. This mod ships no card images and redistributes
no card data; every client fetches and caches its own.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The one place this mod reaches into the game's own code. Camera.setup moves the camera onto
# the player through a protected method, after the event that offers the angles has fired, so
# looking down at a table cannot be done with a listener. See CameraMixin.
[[mixins]]
config = "gathering.mixins.json"

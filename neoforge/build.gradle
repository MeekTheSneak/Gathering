// ---------------------------------------------------------------------------
// :neoforge - primary development target, full verification gate.
// ---------------------------------------------------------------------------
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// A local, not rootProject.sharedModules used inline: inside a plugin's configuration
// closure the delegate resolves `rootProject` to something of its own, and the failure reads
// as a missing property on an unrelated type.
def sharedModules = rootProject.ext.sharedModules

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            // Generated assets land in :common alongside the hand-authored ones.
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', rootProject.file('common/src/generated/resources').getAbsolutePath(),
                '--existing', rootProject.file('common/src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // sharedModules, so this and :fabric cannot disagree about what the
            // mod is made of - see the note there.
            sharedModules.each { sourceSet project(it).sourceSets.main }
        }
    }
}

dependencies {
    sharedModules.each { compileOnly project(it) }
}

// The loader jars carry :common and :core, since neither is published. Taking the
// source sets' *output* picks up their processed resources too, so nothing is copied twice.
tasks.named('jar', Jar) {
    sharedModules.each { from project(it).sourceSets.main.output }
}

tasks.named('compileJava') {
    dependsOn ':common:classes', ':core:classes'
}

// Property expansion for neoforge.mods.toml, so versions live in one place.
processResources {
    def expandProps = [
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
        minecraft_version_range    : minecraft_version_range,
        neo_version_range          : neo_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

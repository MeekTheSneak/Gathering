// ---------------------------------------------------------------------------
// :neoforge - primary development target, full verification gate.
// ---------------------------------------------------------------------------
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// A local, not rootProject.sharedModules used inline: inside a plugin's configuration
// closure the delegate resolves `rootProject` to something of its own, and the failure reads
// as a missing property on an unrelated type.
def sharedModules = rootProject.ext.sharedModules

neoForge {
    version = project.neo_version

    // One field, so a card shop can be added to a village's house pool. See the file itself
    // and LocalGameStore for why there is no other way in.
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Armed only when asked for: -Pdevscene drives the client through a scripted
            // session and photographs it. See DevScene.
            if (project.hasProperty('devscene')) {
                systemProperty 'gathering.devscene', '1'
                // And -Pgallery on top of it photographs every look wearing the same three
                // screens. Separate because it is not a check and has no business in a gate.
                if (project.hasProperty('gallery')) {
                    systemProperty 'gathering.gallery', '1'
                }
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            // Generated assets land in :common alongside the hand-authored ones.
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', rootProject.file('common/src/generated/resources').getAbsolutePath(),
                '--existing', rootProject.file('common/src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // sharedModules, so this and :fabric cannot disagree about what the
            // mod is made of - see the note there.
            sharedModules.each { sourceSet project(it).sourceSets.main }
        }
    }
}

dependencies {
    sharedModules.each { compileOnly project(it) }
}

// The loader jars carry :common and :core, since neither is published. Taking the
// source sets' *output* picks up their processed resources too, so nothing is copied twice.
tasks.named('jar', Jar) {
    sharedModules.each { from project(it).sourceSets.main.output }
}

// A game test server keeps its world between runs, and a world that outlives one run is a
// world the next one inherits: a table somebody's test sat down at is still there, still
// ticking a session, with no client left to send it to - and the whole gate dies with
// "Payload gathering:table_view may not be sent to the client!" instead of reporting on the
// change being tested. Every run starts from nothing.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/world')
    }
}

tasks.named('compileJava') {
    dependsOn ':common:classes', ':core:classes'
}

// Property expansion for neoforge.mods.toml, so versions live in one place.
processResources {
    def expandProps = [
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
        minecraft_version_range    : minecraft_version_range,
        neo_version_range          : neo_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

// ---------------------------------------------------------------------------
// :neoforge - primary development target, full verification gate.
// ---------------------------------------------------------------------------
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// A local, not rootProject.sharedModules used inline: inside a plugin's configuration
// closure the delegate resolves `rootProject` to something of its own, and the failure reads
// as a missing property on an unrelated type.
def sharedModules = rootProject.ext.sharedModules

// The in-world tests live in their own source set, the way :fabric's testmod already did.
// They were in main, so all seventy-five of them were compiled into the shipped jar - about a
// megabyte of test classes in every copy of the mod anybody installs. Moving them changes
// nothing about what runs: the game test server takes its classpath from here, and the gate
// fails if either loader reports no tests, which is what would happen if this were wired
// wrongly.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        // The scripted client run, shared with :fabric's testmod. Development code, so it is
        // compiled here - into the runs and never into the jar - and ticked by DevSceneTicks.
        java.srcDir rootProject.file('common/src/devscene/java')
    }
}

neoForge {
    version = project.neo_version

    // One field, so a card shop can be added to a village's house pool. See the file itself
    // and LocalGameStore for why there is no other way in.
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            // Opt-in rendering characterization; only development runs include the probe.
            if (project.hasProperty('screenRefactorScene')) {
                systemProperty 'gathering.screenRefactorScene', project.property('screenRefactorScene')
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Armed only when asked for: -Pdevscene drives the client through a scripted
            // session and photographs it. See DevScene.
            if (project.hasProperty('devscene')) {
                systemProperty 'gathering.devscene', '1'
                // And -Pgallery on top of it photographs every look wearing the same three
                // screens. Separate because it is not a check and has no business in a gate.
                if (project.hasProperty('gallery')) {
                    systemProperty 'gathering.gallery', '1'
                }
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Modpack qualification (CL-14): the same client, server and game tests with other mods'
        // jars loaded beside this one. Put the jars in runs/pack/mods, or runs/pack-tests/mods
        // for the tests. Nothing here downloads or ships them, and the gate never looks in these
        // directories - they are for answering "does it still work in the pack".
        packClient {
            client()
            gameDirectory = project.file('runs/pack')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // -Ppackscene photographs the pack's integrations in a real client. See PackScene.
            if (project.hasProperty('packscene')) {
                systemProperty 'gathering.packscene', '1'
            }
        }
        packServer {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/pack')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        packGameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/pack-tests')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            // Generated assets land in :common alongside the hand-authored ones.
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', rootProject.file('common/src/generated/resources').getAbsolutePath(),
                '--existing', rootProject.file('common/src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // sharedModules, so this and :fabric cannot disagree about what the
            // mod is made of - see the note there.
            sharedModules.each { sourceSet project(it).sourceSets.main }
            // The tests, for the runs only. They are part of the mod as far as a development
            // run is concerned - the game test server has to find them - and no part of it as
            // far as the jar is concerned, which is the whole point of the split.
            sourceSet sourceSets.gametest
        }
    }
}

// After the source set rather than inside it, for the reason :fabric's build spells out: a
// source set's classpath is copied when it is declared.
sharedModules.each {
    sourceSets.gametest.compileClasspath += project(it).sourceSets.main.output
    sourceSets.gametest.runtimeClasspath += project(it).sourceSets.main.output
}

// Other mods this one works alongside. Each group comes only from its own repository, so a
// typo in one coordinate cannot pull a same-named artifact from somewhere else.
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter {
            includeGroup 'dev.ryanhcode.sable-companion'
            includeGroup 'dev.ryanhcode.sable'
        }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.createmod.net' } }
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ithundxr.dev/snapshots' } }
        filter { includeGroup 'com.tterrag.registrate' }
    }
}

dependencies {
    sharedModules.each { compileOnly project(it) }

    // Sable's companion: tables on Create Aeronautics' moving structures. Bundled, as Sable asks,
    // because it answers with plain world positions when Sable is not installed - so the
    // integration costs nothing on a server without it. MIT licensed.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[${sable_companion_version},)")) {
        version { prefer sable_companion_version }
    }

    // Create, for display sources and the deployer. Compiled against and never shipped: nothing
    // of Create's is touched unless Create is installed. The versions are the ones Create
    // 6.0.10 itself builds with.
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc1.21.1") { transitive = false }
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}") { transitive = false }

    // Sable itself, for the in-world tests that build a moving structure. The tests only, and
    // only registered when Sable is installed - see PackGameTests.
    gametestCompileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${sable_version}") { transitive = false }
}

// The loader jars carry :common and :core, since neither is published. Taking the
// source sets' *output* picks up their processed resources too, so nothing is copied twice.
tasks.named('jar', Jar) {
    sharedModules.each { from project(it).sourceSets.main.output }
}

// A game test server keeps its world between runs, and a world that outlives one run is a
// world the next one inherits: a table somebody's test sat down at is still there, still
// ticking a session, with no client left to send it to - and the whole gate dies with
// "Payload gathering:table_view may not be sent to the client!" instead of reporting on the
// change being tested. Every run starts from nothing.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/world')
    }
}
tasks.matching { it.name == 'runPackGameTestServer' }.configureEach {
    doFirst {
        delete file('runs/pack-tests/world')
    }
}

tasks.named('compileJava') {
    dependsOn ':common:classes', ':core:classes'
}

tasks.named('compileGametestJava') {
    dependsOn ':common:classes', ':core:classes'
}

// The tests have to be compiled for a run to find them, and `build` does not compile a source
// set nothing depends on. Without this the gate would run against whatever was last compiled.
tasks.matching { it.name == 'runGameTestServer' || it.name == 'runPackGameTestServer' }.configureEach {
    dependsOn tasks.named('gametestClasses')
}

// Property expansion for neoforge.mods.toml, so versions live in one place.
processResources {
    def expandProps = [
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                : mod_authors,
        mod_description            : mod_description,
        minecraft_version_range    : minecraft_version_range,
        neo_version_range          : neo_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

# ---------------------------------------------------------------------------
# Gathering - version pins.
#
# Every version here is deliberate. Minecraft's modding APIs differ between
# minor versions and nothing in a code sample marks which version it came from,
# so the target is stated once, here, and DIALECT.md points at it.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=gathering
mod_name=Gathering
mod_version=0.2.0
mod_group_id=dev.gathering
mod_license=MIT
mod_authors=Gathering contributors
mod_description=A multiblock table that turns into a full tabletop card game surface. Unofficial Fan Content.

# Minecraft / Java
minecraft_version=1.21.1
# Exactly what is built and verified, not everything that might happen to load. A mod
# compiled against 1.21.1 is not automatically binary compatible with a later 1.21.x, and
# advertising a range nobody has run turns a clean dependency refusal into a crash halfway
# through somebody's game. Widen this when a build for the wider range is verified.
minecraft_version_range=[1.21.1]
java_version=21

# NeoForge (primary development target, full verification gate)
neo_version=21.1.248
# The 21.1 line, which is what this is built and tested against, with no open upper end: a
# NeoForge 21.2 for a later Minecraft would otherwise satisfy this.
# The oldest NeoForge 1.21.1 it loads on: every in-world test and the tour's opening in a client were run on
# 21.1.1 itself (-Pneo_version=21.1.1). Sable's companion is no longer bundled, so its 21.1.80 floor no longer
# applies; on 21.1.80 the mod once did not load at all, until its mod-bus subscribers named their bus.
neo_version_range=[21.1.1,21.2)
neoforge_loader_version_range=[4,)
moddev_gradle_version=2.0.144

# Vanilla Minecraft for the :common module (MDG "vanilla mode")
neoform_version=1.21.1-20240808.144430

# Parchment parameter mappings (parameter names only; no effect on API shape)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Fabric (port target, verified per phase rather than per commit)
fabric_loom_version=1.9.2
fabric_loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1
# The oldest Fabric Loader and Fabric API a player may run this with, which is what fabric.mod.json asks for -
# not the ones above, which are what it is built against. Checked by running the Fabric in-world tests and a
# client boot (:fabric:runKeyScene) on exactly these: -Pfabric_loader_version=0.15.11
# -Pfabric_api_version=0.102.0+1.21.1. Asking for the newest cut out every pack a release behind.
fabric_loader_min_version=0.15.11
fabric_api_min_version=0.102.0+1.21.1

# Test tooling for the pure core
junit_version=5.11.4
jqwik_version=1.9.2
assertj_version=3.27.3
gson_version=2.11.0

# Mods this one integrates with, compiled against and never shipped (Sable's companion is
# bundled; see neoforge/build.gradle). Create's are the versions Create 6.0.10 builds with.
sable_companion_version=1.6.0
sable_version=2.0.5
create_version=6.0.10-281
ponder_version=1.0.82
registrate_version=MC1.21-1.3.0+67
flywheel_version=1.0.6
